name: Deploy DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (shallow, for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Notify — deploy started
        id: notify
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_NOTIFY_TOKEN }}
          TG_CHAT_ID: "-1004405301190"
        run: |
          # Files to exclude from the changed-files list
          IGNORE_FILES=(
            "landing/stats.json"
          )

          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          # Build grep filter args from ignore list
          FILTER_ARGS=()
          for f in "${IGNORE_FILES[@]}"; do FILTER_ARGS+=(-e "$f"); done

          RAW_DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null)
          if [ ${#FILTER_ARGS[@]} -gt 0 ]; then
            FILTERED=$(echo "$RAW_DIFF" | grep -vF "${FILTER_ARGS[@]}" || true)
          else
            FILTERED="$RAW_DIFF"
          fi

          FILE_COUNT=$(echo "$FILTERED" | grep -c . || true)
          FILES_SECTION=$(echo "$FILTERED" | head -10 | sed 's/^/  • /')

          if [ -z "$FILES_SECTION" ]; then
            FILES_SECTION="no file diff available"
          elif [ "$FILE_COUNT" -gt 10 ]; then
            EXTRA=$((FILE_COUNT - 10))
            FILES_SECTION="${FILES_SECTION}
          ... and ${EXTRA} more"
          fi

          # Base message (reused by success/failure steps via /tmp file)
          BASE_MSG='<tg-emoji emoji-id="5341715473882955310">🔧</tg-emoji> <b>dev</b> — <code>'"${SHORT_SHA}"'</code>
          <tg-emoji emoji-id="5443038326535759644">💬</tg-emoji> '"${COMMIT_MSG}"'

          <tg-emoji emoji-id="5431721976769027887">📂</tg-emoji> Changed files ('"${FILE_COUNT}"'):
          <pre>'"${FILES_SECTION}"'</pre>'

          echo "$BASE_MSG" > /tmp/tg_base_msg.txt

          FULL_MSG="${BASE_MSG}

          🔄 Деплоится..."

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${FULL_MSG}")

          MESSAGE_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['message_id'])")
          echo "message_id=${MESSAGE_ID}" >> $GITHUB_OUTPUT

      - name: Deploy to server
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/reefbot/repo
            git checkout dev
            git pull
            mvn clean package -Dmaven.test.skip=true -q
            cp target/*.jar /opt/reefbot/dev/app.jar
            cp -r landing/* /opt/reefbot/landing/
            systemctl restart reefbot-dev
            echo "DEV deployed successfully"

      - name: Notify — success
        if: steps.deploy.outcome == 'success' && steps.notify.outcome == 'success'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_NOTIFY_TOKEN }}
          TG_CHAT_ID: "-1004405301190"
          MESSAGE_ID: ${{ steps.notify.outputs.message_id }}
        run: |
          BASE_MSG=$(cat /tmp/tg_base_msg.txt)
          UPDATED_MSG="${BASE_MSG}

          ✅ Бот перезапущен — изменения активны"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/editMessageText" \
            -d chat_id="${TG_CHAT_ID}" \
            -d message_id="${MESSAGE_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${UPDATED_MSG}"

      - name: Notify — failure
        if: always() && steps.deploy.outcome == 'failure' && steps.notify.outcome == 'success'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_NOTIFY_TOKEN }}
          TG_CHAT_ID: "-1004405301190"
          MESSAGE_ID: ${{ steps.notify.outputs.message_id }}
        run: |
          BASE_MSG=$(cat /tmp/tg_base_msg.txt)
          UPDATED_MSG="${BASE_MSG}

          ❌ Деплой упал — проверь Actions"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/editMessageText" \
            -d chat_id="${TG_CHAT_ID}" \
            -d message_id="${MESSAGE_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${UPDATED_MSG}"
