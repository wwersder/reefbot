name: Telegram Notify

# Dev and main branches notify via their own deploy workflows
on:
  push:
    branches-ignore:
      - dev
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (shallow, for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Telegram message
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_NOTIFY_TOKEN }}
          TG_CHAT_ID: "-1004405301190"
        run: |
          IGNORE_FILES=("landing/stats.json")

          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          FILTER_ARGS=()
          for f in "${IGNORE_FILES[@]}"; do FILTER_ARGS+=(-e "$f"); done

          RAW_DIFF=$(git diff --name-only HEAD~1 HEAD 2>/dev/null)
          if [ ${#FILTER_ARGS[@]} -gt 0 ]; then
            FILTERED=$(echo "$RAW_DIFF" | grep -vF "${FILTER_ARGS[@]}" || true)
          else
            FILTERED="$RAW_DIFF"
          fi

          FILE_COUNT=$(echo "$FILTERED" | grep -c . || echo 0)
          FILES_SECTION=$(echo "$FILTERED" | head -10 | sed 's/^/  • /')
          if [ -z "$(echo "$FILES_SECTION" | tr -d '[:space:]')" ]; then
            FILES_SECTION="  no changes"
          elif [ "$FILE_COUNT" -gt 10 ]; then
            EXTRA=$((FILE_COUNT - 10))
            FILES_SECTION="${FILES_SECTION}"$'\n'"  ... and ${EXTRA} more"
          fi

          N=$'\n'

          MSG="🌿 <b>${BRANCH}</b>  ·  <code>${SHORT_SHA}</code>${N}${N}"
          MSG+='<tg-emoji emoji-id="5443038326535759644">💬</tg-emoji>  '"${COMMIT_MSG}${N}${N}"
          MSG+='<tg-emoji emoji-id="5431721976769027887">📂</tg-emoji>  <b>'"${FILE_COUNT}"' files changed</b>'"${N}"
          MSG+="<pre>${FILES_SECTION}</pre>"

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d disable_web_page_preview="true" \
            --data-urlencode "text=${MSG}"
