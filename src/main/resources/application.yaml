spring:
  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  profiles:
    active: dev

  # ── HikariCP connection pool ───────────────────────────────────────────────
  # При 1000 одновременных игроках дефолтных 10 соединений недостаточно.
  # 50 соединений покрывают пиковую нагрузку; minimum-idle держит пул тёплым.
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 5
      idle-timeout: 300000       # 5 мин — отпускаем простаивающие соединения
      connection-timeout: 20000  # 20 сек — не ждать вечно при перегрузке
      leak-detection-threshold: 60000  # логировать потенциальные утечки > 60 сек

  # ── Scheduler thread pool ──────────────────────────────────────────────────
  # Дефолтный пул @Scheduled = 1 поток, все задачи выстраиваются в очередь.
  # С 5 потоками уведомления рыбалки и прилива не блокируют друг друга.
  task:
    scheduling:
      pool:
        size: 5

