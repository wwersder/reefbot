<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReefBot Admin — Вход</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f5f6fa; display: flex; align-items: center;
               justify-content: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 12px; padding: 40px 36px;
                box-shadow: 0 4px 20px rgba(0,0,0,.1); width: 360px; }
        .logo { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 32px; color: #1a202c; }
        .logo span { color: #38a169; }
        label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #e2e8f0; border-radius: 8px;
                font-size: 14px; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #3182ce; }
        button { width: 100%; padding: 11px; background: #3182ce; color: #fff; border: none;
                 border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        button:hover { background: #2b6cb0; }
        .error { background: #fff5f5; border: 1px solid #feb2b2; color: #c53030;
                 padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .success { background: #f0fff4; border: 1px solid #9ae6b4; color: #276749;
                   padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">🪸 Reef<span>Bot</span> Admin</div>

    <div class="error" th:if="${param.error}">Неверный логин или пароль.</div>
    <div class="success" th:if="${param.logout}">Вы вышли из системы.</div>

    <form method="post" th:action="@{/admin/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>Логин</label>
        <input type="text" name="username" autocomplete="username" required />
        <label>Пароль</label>
        <input type="password" name="password" autocomplete="current-password" required />
        <button type="submit">Войти</button>
    </form>
</div>
</body>
</html>
