<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{admin/layout :: head('История игрока')}"><title>История игрока</title></head>
<body>
<th:block th:replace="~{admin/layout :: sidebar('tickets')}"/>
<div class="main">
    <a th:href="@{/admin/tickets}" class="back-link">← Обращения</a>

    <h1>
        👤 <span th:text="${player.username != null ? '@' + player.username : 'Игрок'}">@user</span>
        <span style="font-size:14px;color:#6b7280;font-weight:400">
            · ID: <span th:text="${player.telegramId}">0</span>
        </span>
    </h1>

    <div class="card" style="margin-bottom:16px" th:if="${player.island != null}">
        🏝 <strong th:text="${player.island.name}">Island</strong>
        &nbsp;·&nbsp;
        <span th:text="${player.island.devPoints}">0</span> ОР
    </div>

    <div class="card">
        <h2>Все обращения</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Статус</th>
                        <th>Взял</th>
                        <th>Создан</th>
                        <th>Закрыт</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${tickets}">
                        <td><a th:href="@{/admin/tickets/{id}(id=${t.id})}" th:text="'#' + ${t.id}">#1</a></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${t.status.name() == 'OPEN' ? 'badge-open' :
                                                   t.status.name() == 'IN_PROGRESS' ? 'badge-progress' :
                                                   t.status.name() == 'RESOLVED' ? 'badge-resolved' : 'badge-closed'}"
                                  th:text="${t.status.emoji() + ' ' + t.status.displayName()}">🟡</span>
                        </td>
                        <td th:text="${t.claimedBy != null ? (t.claimedBy.username != null ? '@' + t.claimedBy.username : t.claimedBy.firstName) : '—'}">—</td>
                        <td th:text="${#temporals.format(t.createdAt, 'd MMM yyyy, HH:mm')}">—</td>
                        <td th:text="${t.resolvedAt != null ? #temporals.format(t.resolvedAt, 'd MMM yyyy, HH:mm') : '—'}">—</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tickets)}">
                        <td colspan="5" style="text-align:center;color:#6b7280;padding:24px">Обращений нет</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
