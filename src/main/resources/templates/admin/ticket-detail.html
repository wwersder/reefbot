<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{admin/layout :: head('Тикет')}"><title>Тикет</title></head>
<body>
<th:block th:replace="~{admin/layout :: sidebar('tickets')}"/>
<div class="main">
    <a th:href="@{/admin/tickets}" class="back-link">← Обращения</a>

    <div class="card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px">
            <div>
                <h1 style="margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                    🎫 Тикет #<span th:text="${ticket.id}">1</span>
                    <span class="badge"
                          th:classappend="${ticket.status.name() == 'OPEN' ? 'badge-open' :
                                           ticket.status.name() == 'IN_PROGRESS' ? 'badge-progress' :
                                           ticket.status.name() == 'RESOLVED' ? 'badge-resolved' : 'badge-closed'}"
                          th:text="${ticket.status.emoji() + ' ' + ticket.status.displayName()}">🟡 Открыт</span>
                </h1>
                <div style="font-size:12px;color:#6b7280">
                    Создан: <span th:text="${#temporals.format(ticket.createdAt, 'd MMM yyyy, HH:mm')}">—</span>
                    <span th:if="${ticket.resolvedAt != null}">
                        · Закрыт: <span th:text="${#temporals.format(ticket.resolvedAt, 'd MMM yyyy, HH:mm')}">—</span>
                    </span>
                </div>
            </div>
            <div style="font-size:13px;color:#374151">
                <div>
                    👤 <a th:href="@{/admin/players/{tgId}/tickets(tgId=${ticket.player.telegramId})}"
                           th:text="${ticket.player.username != null ? '@' + ticket.player.username : 'ID ' + ticket.player.telegramId}">@user</a>
                    <span style="color:#9ca3af"> · </span>
                    <span style="color:#6b7280;font-size:12px" th:text="'ID: ' + ${ticket.player.telegramId}">0</span>
                </div>
                <div th:if="${ticket.player.island != null}" style="margin-top:4px">
                    🏝 <span th:text="${ticket.player.island.name}">Island</span>
                    · <span th:text="${ticket.player.island.devPoints}">0</span> ОР
                </div>
                <div th:if="${ticket.claimedBy != null}" style="margin-top:4px">
                    👷 <span th:text="${ticket.claimedBy.username != null ? '@' + ticket.claimedBy.username : ticket.claimedBy.firstName}">staff</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>💬 История переписки</h2>
        <div class="msg-list">
            <div th:each="msg : ${messages}"
                 th:class="${msg.direction.name() == 'FROM_PLAYER' ? 'msg-bubble msg-from-player' : 'msg-bubble msg-from-support'}">

                <div class="msg-meta">
                    <span th:text="${msg.senderName}">Игрок</span>
                    · <span th:text="${#temporals.format(msg.sentAt, 'HH:mm, d MMM')}">—</span>
                </div>

                <!-- Photo -->
                <div th:if="${msg.attachmentType != null and msg.attachmentType.name() == 'PHOTO'}">
                    <img th:src="@{/admin/media/photo/{id}(id=${msg.attachmentFileId})}"
                         alt="фото"
                         style="max-width:280px;max-height:300px;border-radius:8px;
                                display:block;margin-top:4px;cursor:pointer"
                         onclick="openImg(this.src)">
                    <div class="badge-attach" th:if="${msg.text != null and !#strings.isEmpty(msg.text)}"
                         th:text="${msg.text}" style="margin-top:5px;color:#374151;font-size:13px"></div>
                </div>

                <!-- Text -->
                <div class="msg-text"
                     th:if="${(msg.attachmentType == null or msg.attachmentType.name() != 'PHOTO') and msg.text != null and !#strings.isEmpty(msg.text)}"
                     th:text="${msg.text}"></div>

                <!-- Other attachments (not photo) -->
                <div class="badge-attach"
                     th:if="${msg.attachmentType != null and msg.attachmentType.name() != 'PHOTO'}"
                     th:text="${'📎 ' + msg.attachmentType.name().toLowerCase()}">📎 voice</div>

                <!-- Empty / forwarded without content -->
                <div th:if="${msg.text == null and msg.attachmentType == null}"
                     style="color:#9ca3af;font-size:12px;font-style:italic">
                    📨 Пересланное сообщение
                </div>

            </div>
            <div th:if="${#lists.isEmpty(messages)}"
                 style="text-align:center;color:#6b7280;padding:24px">Сообщений нет</div>
        </div>
    </div>

    <!-- Lightbox for photos -->
    <div id="lightbox" onclick="this.style.display='none'"
         style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
                z-index:9999;align-items:center;justify-content:center;cursor:zoom-out">
        <img id="lightbox-img" src="" alt="фото"
             style="max-width:90vw;max-height:90vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6)">
    </div>
    <script>
        function openImg(src) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
    </script>
</div>
</body>
</html>
