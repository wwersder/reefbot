<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">

<!-- ── head fragment ─────────────────────────────────────────── -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — ReefBot Admin'">ReefBot Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --sidebar-w: 230px;
            --bg: #f0f2f7;
            --surface: #ffffff;
            --sidebar-bg: #111827;
            --sidebar-hover: #1f2937;
            --accent: #3b82f6;
            --accent-dark: #2563eb;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
            --danger: #ef4444;
            --radius: 10px;
            --shadow: 0 1px 6px rgba(0,0,0,.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── Overlay (mobile) ── */
        .overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,.5);
            z-index: 99;
        }
        .overlay.open { display: block; }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; top: 0; left: 0;
            width: var(--sidebar-w);
            height: 100dvh;
            background: var(--sidebar-bg);
            display: flex; flex-direction: column;
            z-index: 100;
            transition: transform .25s ease;
        }
        .sidebar-logo {
            padding: 20px 20px 18px;
            font-size: 18px; font-weight: 700; color: #fff;
            border-bottom: 1px solid #1f2937;
            flex-shrink: 0;
        }
        .sidebar-logo span { color: #34d399; }
        .sidebar-nav {
            flex: 1; overflow-y: auto;
            padding: 12px 10px;
        }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            color: #9ca3af; font-size: 13.5px; font-weight: 500;
            text-decoration: none;
            border-radius: 8px;
            transition: background .15s, color .15s;
            margin-bottom: 2px;
        }
        .sidebar-nav a .nav-icon {
            font-size: 16px; width: 20px; text-align: center; flex-shrink: 0;
        }
        .sidebar-nav a:hover {
            background: rgba(255,255,255,.07);
            color: #e5e7eb;
            text-decoration: none;
        }
        .sidebar-nav a.active {
            background: rgba(52,211,153,.12);
            color: #34d399;
        }
        .sidebar-nav a.active .nav-icon { color: #34d399; }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid #1f2937;
            flex-shrink: 0;
        }
        .sidebar-footer form button {
            background: none; border: none;
            color: #f87171; font-size: 13px;
            cursor: pointer; padding: 0;
            display: flex; align-items: center; gap: 6px;
        }
        .sidebar-footer form button:hover { color: #fca5a5; }

        /* ── Top bar (mobile) ── */
        .topbar {
            display: none;
            position: fixed; top: 0; left: 0; right: 0;
            height: 52px;
            background: var(--sidebar-bg);
            align-items: center;
            padding: 0 16px;
            z-index: 98;
            gap: 14px;
        }
        .topbar-logo { color: #fff; font-size: 16px; font-weight: 700; }
        .topbar-logo span { color: #34d399; }
        .hamburger {
            background: none; border: none;
            cursor: pointer; padding: 6px;
            color: #9ca3af;
            display: flex; flex-direction: column;
            gap: 4px; margin-left: auto;
        }
        .hamburger span {
            display: block; width: 22px; height: 2px;
            background: currentColor; border-radius: 2px;
            transition: .2s;
        }

        /* ── Main content ── */
        .main {
            margin-left: var(--sidebar-w);
            padding: 32px;
            min-height: 100vh;
        }

        /* ── Typography ── */
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
        h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

        /* ── Cards ── */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        /* ── Stats grid ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 18px 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat .val { font-size: 32px; font-weight: 700; color: var(--accent); line-height: 1; }
        .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 6px; }

        /* ── Tables ── */
        .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
        th {
            text-align: left; padding: 9px 12px;
            font-size: 11px; font-weight: 600;
            color: var(--muted); border-bottom: 2px solid var(--border);
            text-transform: uppercase; letter-spacing: .05em;
            white-space: nowrap;
        }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f9fafb; }

        /* ── Links ── */
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: var(--shadow);
            color: var(--muted); font-size: 13px; font-weight: 500;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color .15s, border-color .15s, box-shadow .15s;
        }
        .back-link:hover {
            color: var(--text); border-color: #d1d5db;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
            text-decoration: none;
        }
        .link-history {
            display: inline-flex; align-items: center; gap: 3px;
            font-size: 11px; font-weight: 500; color: var(--muted);
            text-decoration: none;
            padding: 2px 7px; border-radius: 5px;
            border: 1px solid var(--border);
            transition: color .15s, border-color .15s;
        }
        .link-history:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }

        /* ── Badges ── */
        code {
            background: #f3f4f6; padding: 2px 7px;
            border-radius: 5px; font-size: 12px; font-family: monospace;
        }
        .badge {
            display: inline-flex; align-items: center;
            padding: 3px 9px; border-radius: 20px;
            font-size: 11px; font-weight: 600; white-space: nowrap;
        }
        .badge-open     { background: #fef9c3; color: #854d0e; }
        .badge-progress { background: #dbeafe; color: #1d4ed8; }
        .badge-resolved { background: #dcfce7; color: #166534; }
        .badge-closed   { background: #fee2e2; color: #991b1b; }

        /* ── Filter bar ── */
        .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 14px; border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface); font-size: 12px; font-weight: 500;
            text-decoration: none; color: var(--muted);
            transition: all .15s; white-space: nowrap;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent); color: #fff;
            border-color: var(--accent); text-decoration: none;
        }

        /* ── Chat bubbles ── */
        .msg-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
        .msg-bubble {
            border-radius: 12px; padding: 10px 14px;
            max-width: 78%;
            font-size: 14px; line-height: 1.4;
        }
        .msg-from-player  { background: #f3f4f6; margin-right: auto; border-bottom-left-radius: 4px; }
        .msg-from-support { background: #eff6ff; margin-left: auto; text-align: right; border-bottom-right-radius: 4px; }
        .msg-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
        .msg-text { white-space: pre-wrap; word-break: break-word; }
        .badge-attach { font-size: 11px; color: #7c3aed; margin-top: 4px; }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }

            .topbar { display: flex; }

            .main {
                margin-left: 0;
                padding: 16px;
                padding-top: 68px; /* below topbar */
            }

            .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat .val { font-size: 26px; }

            h1 { font-size: 17px; }
            .card { padding: 14px; }
            .msg-bubble { max-width: 90%; }
        }

        @media (max-width: 400px) {
            .stats { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

<!-- ── sidebar fragment ───────────────────────────────────────── -->
<th:block th:fragment="sidebar(activePage)">
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <div class="topbar">
        <div class="topbar-logo">🪸 Reef<span>Bot</span></div>
        <button class="hamburger" onclick="toggleSidebar()" aria-label="Меню">
            <span></span><span></span><span></span>
        </button>
    </div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">🪸 Reef<span>Bot</span></div>
        <nav class="sidebar-nav">
            <a th:href="@{/admin/dashboard}"
               th:class="${activePage == 'dashboard' ? 'active' : ''}">
                <span class="nav-icon">📊</span> Dashboard
            </a>
            <a th:href="@{/admin/tickets}"
               th:class="${activePage == 'tickets' ? 'active' : ''}">
                <span class="nav-icon">🎫</span> Обращения
            </a>
            <a th:href="@{/admin/staff}"
               th:class="${activePage == 'staff' ? 'active' : ''}">
                <span class="nav-icon">👷</span> Персонал
            </a>
            <a th:href="@{/admin/guide/conduct}"
               th:class="${activePage == 'guide' ? 'active' : ''}">
                <span class="nav-icon">📋</span> Гайды
            </a>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/admin/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit">⇤ Выйти</button>
            </form>
        </div>
    </aside>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
    </script>
</th:block>

</html>
