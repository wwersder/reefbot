<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">

<!-- ── head fragment ─────────────────────────────────────────── -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — ReefBot Admin'">ReefBot Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f5f6fa; color: #2d3748; }
        .sidebar { position: fixed; top: 0; left: 0; width: 220px; height: 100vh;
                   background: #1a202c; padding: 24px 0; overflow-y: auto; }
        .sidebar .logo { color: #fff; font-size: 18px; font-weight: 700;
                         padding: 0 20px 24px; border-bottom: 1px solid #2d3748; margin-bottom: 8px; }
        .sidebar .logo span { color: #68d391; }
        .sidebar nav a, .sidebar .nav-link { display: block; padding: 10px 20px; color: #a0aec0;
                         text-decoration: none; font-size: 14px; transition: all .15s; }
        .sidebar nav a:hover, .sidebar .nav-link:hover,
        .sidebar nav a.active, .sidebar .nav-link.active { color: #fff; background: #2d3748; }
        .sidebar .logout { padding: 20px 20px 0; border-top: 1px solid #2d3748; margin-top: 12px; }
        .sidebar .logout a { color: #fc8181; font-size: 13px; text-decoration: none; }
        .main { margin-left: 220px; padding: 32px; min-height: 100vh; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 24px; color: #1a202c; }
        h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #2d3748; }
        .card { background: #fff; border-radius: 10px; padding: 20px;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 24px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat { background: #fff; border-radius: 10px; padding: 20px;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center; }
        .stat .val { font-size: 36px; font-weight: 700; color: #3182ce; }
        .stat .lbl { font-size: 12px; color: #718096; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 10px 12px; font-size: 12px; font-weight: 600;
             color: #718096; border-bottom: 2px solid #e2e8f0; text-transform: uppercase; }
        td { padding: 10px 12px; border-bottom: 1px solid #edf2f7; vertical-align: top; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f7fafc; }
        a { color: #3182ce; text-decoration: none; }
        a:hover { text-decoration: underline; }
        code { background: #edf2f7; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px;
                 font-size: 11px; font-weight: 600; }
        .badge-open       { background: #fefcbf; color: #744210; }
        .badge-progress   { background: #bee3f8; color: #2b6cb0; }
        .badge-resolved   { background: #c6f6d5; color: #276749; }
        .badge-closed     { background: #fed7d7; color: #9b2c2c; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #e2e8f0;
                      background: #fff; font-size: 13px; text-decoration: none;
                      color: #4a5568; transition: all .15s; }
        .filter-btn.active, .filter-btn:hover { background: #3182ce; color: #fff;
                                                 border-color: #3182ce; }
        .msg-bubble { border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; max-width: 75%; }
        .msg-from-player  { background: #edf2f7; margin-right: auto; }
        .msg-from-support { background: #ebf8ff; margin-left: auto; text-align: right; }
        .msg-meta { font-size: 11px; color: #718096; margin-bottom: 4px; }
        .msg-text { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
        .badge-attach { font-size: 11px; color: #805ad5; }
    </style>
</head>

<!-- ── sidebar fragment ───────────────────────────────────────── -->
<div th:fragment="sidebar(activePage)" class="sidebar">
    <div class="logo">🪸 Reef<span>Bot</span></div>
    <nav>
        <a th:href="@{/admin/dashboard}"
           th:class="'nav-link' + (${activePage} == 'dashboard' ? ' active' : '')">📊 Dashboard</a>
        <a th:href="@{/admin/tickets}"
           th:class="'nav-link' + (${activePage} == 'tickets'   ? ' active' : '')">🎫 Тикеты</a>
        <a th:href="@{/admin/staff}"
           th:class="'nav-link' + (${activePage} == 'staff'     ? ' active' : '')">👷 Персонал</a>
    </nav>
    <div class="logout">
        <form th:action="@{/admin/logout}" method="post" style="display:inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" style="background:none;border:none;color:#fc8181;font-size:13px;cursor:pointer;padding:0">⇤ Выйти</button>
        </form>
    </div>
</div>

</html>
