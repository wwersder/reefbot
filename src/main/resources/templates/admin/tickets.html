<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{admin/layout :: head('Тикеты')}"><title>Тикеты</title></head>
<body>
<th:block th:replace="~{admin/layout :: sidebar('tickets')}"/>
<div class="main">
    <h1>🎫 Обращения</h1>

    <form method="get" action="/admin/tickets" style="margin-bottom:16px;display:flex;gap:8px">
        <input type="text" name="q"
               th:value="${searchQuery}"
               placeholder="Поиск по #ID или @username…"
               style="flex:1;padding:8px 14px;border:1px solid #e5e7eb;border-radius:8px;
                      font-size:13px;font-family:inherit;outline:none;
                      transition:border-color .15s"
               onfocus="this.style.borderColor='#3b82f6'"
               onblur="this.style.borderColor='#e5e7eb'">
        <button type="submit"
                style="padding:8px 18px;background:#3b82f6;color:#fff;border:none;
                       border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;
                       font-family:inherit">
            Найти
        </button>
        <a th:if="${searchQuery != null}" href="/admin/tickets"
           style="padding:8px 14px;border:1px solid #e5e7eb;border-radius:8px;
                  font-size:13px;color:#6b7280;text-decoration:none;display:flex;align-items:center">
            ✕ Сбросить
        </a>
    </form>

    <div class="filter-bar" th:if="${searchQuery == null}">
        <a th:href="@{/admin/tickets}"
           th:class="${selectedStatus == null ? 'filter-btn active' : 'filter-btn'}">Все</a>
        <a th:each="s : ${allStatuses}"
           th:href="@{/admin/tickets(status=${s.name().toLowerCase()})}"
           th:class="${selectedStatus != null && selectedStatus.equalsIgnoreCase(s.name()) ? 'filter-btn active' : 'filter-btn'}"
           th:text="${s.emoji() + ' ' + s.displayName()}">Статус</a>
    </div>

    <div th:if="${searchQuery != null}" style="font-size:13px;color:#6b7280;margin-bottom:10px">
        Результаты по запросу «<b th:text="${searchQuery}"></b>»:
        <span th:text="${tickets.size()}">0</span> найдено
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Игрок</th>
                        <th>Статус</th>
                        <th>Взял</th>
                        <th>Создан</th>
                        <th>Обновлён</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${tickets}">
                        <td><a th:href="@{/admin/tickets/{id}(id=${t.id})}" th:text="'#' + ${t.id}">#1</a></td>
                        <td>
                            <div th:text="${t.player.username != null ? '@' + t.player.username : t.player.telegramId}">@user</div>
                            <a th:href="@{/admin/players/{tgId}/tickets(tgId=${t.player.telegramId})}"
                               class="link-history">История ›</a>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${t.status.name() == 'OPEN' ? 'badge-open' :
                                                   t.status.name() == 'IN_PROGRESS' ? 'badge-progress' :
                                                   t.status.name() == 'RESOLVED' ? 'badge-resolved' : 'badge-closed'}"
                                  th:text="${t.status.emoji() + ' ' + t.status.displayName()}">🟡 Открыт</span>
                        </td>
                        <td th:text="${t.claimedBy != null ? (t.claimedBy.username != null ? '@' + t.claimedBy.username : t.claimedBy.firstName) : '—'}">—</td>
                        <td th:text="${#temporals.format(t.createdAt, 'd MMM, HH:mm')}">—</td>
                        <td th:text="${#temporals.format(t.updatedAt, 'd MMM, HH:mm')}">—</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tickets)}">
                        <td colspan="6" style="text-align:center;color:#6b7280;padding:28px">Обращений нет</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
