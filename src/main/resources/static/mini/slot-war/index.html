<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Шторм vs Штиль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}

:root{
  --bg1:#0d1b2e;--bg2:#091525;
  --accent:#4ade80;--accent2:#22c55e;
  --gold:#fbbf24;--wild:#38bdf8;
  --win:#86efac;--scatter:#fcd34d;
  --cell-bg:rgba(255,255,255,.05);--cell-bd:rgba(255,255,255,.1);
  --panel:rgba(0,0,0,.38);--panel-bd:rgba(255,255,255,.1);
  --gap:3px;
}
body.storm{
  --bg1:#160820;--bg2:#0c0418;
  --accent:#a855f7;--accent2:#7c3aed;
  --wild:#e879f9;--win:#d8b4fe;
}

body{
  background:linear-gradient(175deg,var(--bg1) 0%,var(--bg2) 100%);
  color:#f1f5f9;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;flex-direction:column;
  height:100dvh;overflow:hidden;
}

/* ── TOP BAR ── */
.top-bar{
  flex-shrink:0;height:42px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;gap:8px;
}
.mode-toggle{display:flex;background:rgba(255,255,255,.07);border-radius:18px;padding:3px;gap:2px}
.mode-toggle button{
  border:none;background:transparent;
  color:rgba(255,255,255,.45);font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:14px;cursor:pointer;transition:all .2s;
}
.mode-toggle button.active{background:var(--accent);color:#000;box-shadow:0 2px 8px rgba(74,222,128,.4)}
body.storm .mode-toggle button.active{box-shadow:0 2px 8px rgba(168,85,247,.4)}

.fs-badge{
  display:none;
  background:linear-gradient(135deg,#f59e0b,#d97706);
  color:#000;font-size:10px;font-weight:800;
  padding:3px 10px;border-radius:18px;letter-spacing:.4px;
  animation:badge-pulse 1.4s ease-in-out infinite;
}
.fs-badge.on{display:block}
@keyframes badge-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07);box-shadow:0 0 10px rgba(251,191,36,.6)}}

.balance-chip{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.bc-lbl{font-size:8px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase}
.bc-val{font-size:15px;font-weight:800;color:var(--gold);line-height:1}

/* ── GRID SECTION ── */
.grid-section{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:4px 8px;
  container-type:size;
}
.grid-frame{
  width:min(100%,100cqh);
  aspect-ratio:1;
  position:relative;
  border-radius:12px;overflow:hidden;
  border:1.5px solid rgba(255,255,255,.1);
  box-shadow:0 6px 32px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
  background:rgba(0,0,0,.45);
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:var(--gap);padding:var(--gap);
  width:100%;height:100%;
}
.cell{
  background:var(--cell-bg);border:1px solid var(--cell-bd);
  border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(18px,4.5cqw,30px);
  position:relative;overflow:visible;user-select:none;
  transition:background .12s,border-color .12s;
}

/* Cell states */
.cell.spinning{animation:spin-cell .09s linear infinite}
@keyframes spin-cell{
  0%{opacity:.2;transform:scaleY(.75)}
  50%{opacity:.85;transform:scaleY(1)}
  100%{opacity:.2;transform:scaleY(.75)}
}
.cell.bounce{animation:cell-bounce .28s cubic-bezier(.36,.07,.19,.97)}
@keyframes cell-bounce{
  0%{transform:translateY(0)scale(1)}
  30%{transform:translateY(-7px)scale(1.1)}
  60%{transform:translateY(2px)scale(.96)}
  85%{transform:translateY(-2px)scale(1.02)}
  100%{transform:translateY(0)scale(1)}
}
.cell.win-hl{
  background:rgba(134,239,172,.18)!important;
  border-color:var(--win)!important;
  animation:win-glow .7s ease-in-out infinite alternate;
}
@keyframes win-glow{
  from{box-shadow:0 0 4px var(--win)}
  to{box-shadow:0 0 16px var(--win),0 0 28px rgba(134,239,172,.25)}
}
.cell.expanded{
  background:rgba(56,189,248,.2)!important;
  border-color:var(--wild)!important;
  animation:wild-glow .9s ease-in-out infinite alternate;
}
body.storm .cell.expanded{background:rgba(232,121,249,.2)!important}
@keyframes wild-glow{
  from{box-shadow:0 0 6px var(--wild)}
  to{box-shadow:0 0 22px var(--wild),0 0 36px rgba(56,189,248,.2)}
}
.cell.sticky{border-color:rgba(56,189,248,.4)!important;background:rgba(56,189,248,.07)!important}
.cell.flash-expand{
  background:rgba(56,189,248,.28)!important;border-color:var(--wild)!important;
  animation:exp-flash .1s ease-in-out infinite alternate;
}
body.storm .cell.flash-expand{background:rgba(232,121,249,.28)!important}
@keyframes exp-flash{
  from{box-shadow:0 0 8px var(--wild)}
  to{box-shadow:0 0 26px var(--wild),inset 0 0 8px rgba(255,255,255,.14)}
}
.cell.scatter-anim{
  background:rgba(252,211,77,.18)!important;border-color:var(--scatter)!important;
  animation:scatter-pop .45s ease-in-out 3;
}
@keyframes scatter-pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12);box-shadow:0 0 12px var(--scatter)}}

.mult-badge{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  background:var(--wild);color:#000;
  font-weight:900;font-size:10px;border-radius:6px;padding:2px 5px;
  pointer-events:none;z-index:20;white-space:nowrap;
  animation:badge-pop .4s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes badge-pop{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0}
  70%{transform:translate(-50%,-50%) scale(1.2);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}

#wl-svg{position:absolute;inset:0;pointer-events:none;z-index:15;width:100%;height:100%}

/* Win overlay ON the grid */
#win-overlay{
  display:none;position:absolute;inset:0;
  background:rgba(0,0,0,.68);
  align-items:center;justify-content:center;flex-direction:column;gap:4px;
  z-index:25;backdrop-filter:blur(3px);border-radius:11px;
}
#win-overlay.on{display:flex}
.wo-lbl{font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.5);text-transform:uppercase}
.wo-amt{
  font-size:clamp(28px,8cqw,48px);font-weight:900;color:var(--gold);
  text-shadow:0 0 28px rgba(251,191,36,.7);line-height:1.1;
  animation:amt-pop .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes amt-pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.wo-mult{font-size:14px;font-weight:700;color:var(--wild)}

/* ── WIN ROW (below grid) ── */
.win-row{
  flex-shrink:0;height:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:height .25s ease;
}
.win-row.on{height:38px}
.wr-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}
.wr-amt{font-size:20px;font-weight:800;color:var(--gold)}
.wr-mult{font-size:12px;font-weight:700;color:var(--wild)}

/* ── SPIN ROW ── */
.spin-row{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  padding:6px 0 4px;
}
.spin-btn{
  width:64px;height:64px;border-radius:50%;
  border:3px solid rgba(255,255,255,.22);
  background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.22),transparent 55%),
             linear-gradient(145deg,var(--accent),var(--accent2));
  color:#fff;font-size:26px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(74,222,128,.5),0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .12s,box-shadow .12s;
  flex-shrink:0;
}
body.storm .spin-btn{box-shadow:0 4px 20px rgba(168,85,247,.5),0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2)}
.spin-btn:active:not(:disabled){transform:scale(.9)}
.spin-btn:disabled{opacity:.42;cursor:not-allowed}
.spin-btn.is-spinning{animation:spin-ring .9s linear infinite}
@keyframes spin-ring{
  0%{border-color:rgba(255,255,255,.1)}
  50%{border-color:rgba(255,255,255,.7);box-shadow:0 0 22px var(--accent),0 4px 20px rgba(74,222,128,.3)}
  100%{border-color:rgba(255,255,255,.1)}
}

/* ── BET CARD ── */
.bet-card{
  flex-shrink:0;margin:0 10px 6px;
  background:var(--panel);border:1px solid var(--panel-bd);
  border-radius:14px;padding:10px 14px 8px;
  backdrop-filter:blur(8px);
}
.bet-card-top{display:flex;gap:8px;align-items:flex-start}
.bet-col{flex:1}
.bet-col-r{flex:1;text-align:right}
.bct-lbl{font-size:9px;font-weight:700;letter-spacing:1.1px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:3px}
.bct-val{font-size:17px;font-weight:800;color:#fff;line-height:1}
.bct-val.gold{color:var(--gold)}
.bet-adj-row{display:flex;align-items:center;gap:6px;margin-top:2px}
.bet-adj{
  width:24px;height:24px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.8);font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .12s,transform .1s;flex-shrink:0;line-height:1;
}
.bet-adj:active{background:rgba(255,255,255,.2);transform:scale(.88)}
.bet-val-display{
  font-size:17px;font-weight:800;color:#fff;
  cursor:pointer;padding:1px 4px;
  border-bottom:1px solid rgba(255,255,255,.18);
  min-width:36px;text-align:center;
}
.bet-hint{font-size:8px;color:rgba(255,255,255,.22);margin-top:2px}

.mult-row{display:flex;gap:5px;margin-top:8px}
.mult-btn{
  flex:1;padding:5px 0;
  border-radius:18px;border:1px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.65);font-size:11px;font-weight:700;
  cursor:pointer;text-align:center;transition:all .15s;
}
.mult-btn:active{background:rgba(255,255,255,.18);color:#fff;transform:scale(.94)}

/* ── BOTTOM CONTROLS ── */
.ctrl-row{
  flex-shrink:0;
  display:flex;gap:6px;padding:0 10px 4px;
}
.ctrl-btn{
  flex:1;height:36px;border-radius:18px;
  border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.55);font-size:11px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;
  transition:all .15s;
}
.ctrl-btn:active{background:rgba(255,255,255,.14);transform:scale(.95)}
.ctrl-btn.active{border-color:var(--accent);background:rgba(74,222,128,.1);color:var(--accent)}
body.storm .ctrl-btn.active{border-color:var(--accent);background:rgba(168,85,247,.1);color:var(--accent)}

/* ── WINS STRIP ── */
.wins-strip{
  flex-shrink:0;display:flex;gap:4px;
  padding:0 10px 6px;overflow-x:auto;scrollbar-width:none;
  height:26px;align-items:center;
}
.wins-strip::-webkit-scrollbar{display:none}
.wd{
  min-width:28px;height:18px;border-radius:9px;flex-shrink:0;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:rgba(255,255,255,.22);padding:0 5px;white-space:nowrap;
}
.wd.big{border-color:var(--win);color:var(--win);background:rgba(134,239,172,.09)}
.wd.mega{border-color:var(--gold);color:var(--gold);background:rgba(251,191,36,.09)}

/* ── OVERLAYS ── */
#bonus-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.88);
  flex-direction:column;align-items:center;justify-content:center;gap:12px;
  z-index:200;backdrop-filter:blur(10px);
}
#bonus-overlay.on{display:flex}
.bo-title{font-size:30px;font-weight:900;color:var(--gold);text-shadow:0 0 30px var(--gold);text-align:center;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
.bo-sub{font-size:14px;color:rgba(255,255,255,.6);text-align:center;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) .12s both}
.bo-count{font-size:68px;font-weight:900;color:var(--accent);line-height:1;text-shadow:0 0 36px var(--accent);animation:popIn .5s cubic-bezier(.34,1.56,.64,1) .06s both}
.bo-btn{
  margin-top:4px;padding:13px 44px;border-radius:28px;
  border:2px solid var(--gold);background:rgba(251,191,36,.1);
  color:var(--gold);font-size:16px;font-weight:800;letter-spacing:.8px;
  cursor:pointer;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) .22s both;
}
@keyframes popIn{from{transform:scale(.05);opacity:0}to{transform:scale(1);opacity:1}}

#bigwin-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.8);
  flex-direction:column;align-items:center;justify-content:center;gap:6px;
  z-index:160;backdrop-filter:blur(6px);cursor:pointer;
}
#bigwin-overlay.on{display:flex}
.bw-lbl{font-size:12px;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.45);text-transform:uppercase}
.bw-amt{font-size:50px;font-weight:900;color:var(--gold);text-shadow:0 0 40px var(--gold),0 0 80px rgba(251,191,36,.35);line-height:1;animation:amt-pop .45s cubic-bezier(.34,1.56,.64,1)}
.bw-mult{font-size:18px;font-weight:700;color:var(--wild)}

@keyframes screen-flash{0%{opacity:0}30%{opacity:.55}100%{opacity:0}}
body.flashing::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(circle,rgba(251,191,36,.6) 0%,transparent 70%);
  animation:screen-flash .7s ease-out forwards;
  pointer-events:none;z-index:999;
}

/* Bet input modal */
#bet-modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);
  align-items:flex-end;z-index:250;backdrop-filter:blur(4px);
}
#bet-modal.on{display:flex}
.bet-sheet{
  background:#1a2a3e;border:1px solid rgba(255,255,255,.12);
  border-radius:20px 20px 0 0;padding:16px 16px 32px;width:100%;
  animation:slide-up .22s ease-out;
}
@keyframes slide-up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.bs-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:1px;text-align:center;margin-bottom:10px}
.bs-input{
  width:100%;background:rgba(0,0,0,.4);border:1.5px solid rgba(255,255,255,.18);
  border-radius:12px;padding:11px 14px;color:#fff;font-size:22px;font-weight:800;
  text-align:center;outline:none;margin-bottom:10px;
}
.bs-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.bs-preset{
  padding:9px 0;border-radius:10px;border:1.5px solid rgba(255,255,255,.11);
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.75);
  font-size:13px;font-weight:700;cursor:pointer;text-align:center;
}
.bs-preset:active{background:rgba(255,255,255,.18);transform:scale(.95)}
.bs-confirm{
  width:100%;padding:13px;border-radius:28px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#000;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.3px;
}

#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(10,20,36,.92);border:1px solid rgba(255,255,255,.14);
  color:#fff;padding:9px 20px;border-radius:22px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:300;white-space:nowrap;backdrop-filter:blur(5px);
}
#toast.on{opacity:1}
</style>
</head>
<body id="app">

<!-- TOP BAR -->
<div class="top-bar">
  <div class="mode-toggle">
    <button id="m-calm" class="active" onclick="setMode('CALM')">☀️ Штиль</button>
    <button id="m-storm" onclick="setMode('STORM')">⚡ Шторм</button>
  </div>
  <div class="fs-badge" id="fs-badge">🎰 <span id="fs-cnt">0</span> спинов</div>
  <div class="balance-chip">
    <div class="bc-lbl">Баланс</div>
    <div class="bc-val">🐚 <span id="bal">—</span></div>
  </div>
</div>

<!-- GRID -->
<div class="grid-section">
  <div class="grid-frame">
    <div class="grid" id="grid"></div>
    <svg id="wl-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="win-overlay">
      <div class="wo-lbl">Выигрыш</div>
      <div class="wo-amt" id="wo-amt"></div>
      <div class="wo-mult" id="wo-mult"></div>
    </div>
  </div>
</div>

<!-- WIN ROW -->
<div class="win-row" id="win-row">
  <span class="wr-lbl">ВЫИГРЫШ</span>
  <span class="wr-amt" id="wr-amt"></span>
  <span class="wr-mult" id="wr-mult"></span>
</div>

<!-- SPIN -->
<div class="spin-row">
  <button class="spin-btn" id="spin-btn" onclick="spin()">▶</button>
</div>

<!-- BET CARD -->
<div class="bet-card">
  <div class="bet-card-top">
    <div class="bet-col">
      <div class="bct-lbl">Ставка</div>
      <div class="bet-adj-row">
        <button class="bet-adj" onclick="adjBet(-1)">−</button>
        <div class="bet-val-display" id="bet-disp" onclick="openBetModal()">50</div>
        <button class="bet-adj" onclick="adjBet(1)">+</button>
      </div>
      <div class="bet-hint">нажми для ввода</div>
    </div>
    <div class="bet-col-r">
      <div class="bct-lbl">Баланс</div>
      <div class="bct-val gold">🐚 <span id="bal2">—</span></div>
    </div>
  </div>
  <div class="mult-row">
    <button class="mult-btn" onclick="multBet(.1)">×0.1</button>
    <button class="mult-btn" onclick="multBet(.5)">×0.5</button>
    <button class="mult-btn" onclick="multBet(2)">×2</button>
    <button class="mult-btn" onclick="multBet(10)">×10</button>
  </div>
</div>

<!-- CONTROLS -->
<div class="ctrl-row">
  <button class="ctrl-btn" id="turbo-btn" onclick="toggleTurbo()">⚡ Турбо</button>
  <button class="ctrl-btn" id="auto-btn"  onclick="toggleAuto()">↻ Авто</button>
  <button class="ctrl-btn" onclick="showInfo()">ℹ️ Правила</button>
</div>

<!-- WINS STRIP -->
<div class="wins-strip" id="wins-strip"></div>

<!-- BONUS OVERLAY -->
<div id="bonus-overlay">
  <div class="bo-title">🎰 БОНУС!</div>
  <div class="bo-sub">Бесплатные спины активированы</div>
  <div class="bo-count" id="bo-cnt">10</div>
  <div class="bo-sub">Sticky Wild · Накопленный выигрыш</div>
  <button class="bo-btn" onclick="dismissBonus()">ИГРАТЬ!</button>
</div>

<!-- BIG WIN -->
<div id="bigwin-overlay" onclick="dismissBigWin()">
  <div class="bw-lbl">🏆 Большой выигрыш!</div>
  <div class="bw-amt" id="bw-amt"></div>
  <div class="bw-mult" id="bw-mult"></div>
</div>

<!-- BET MODAL -->
<div id="bet-modal" onclick="modalOutside(event)">
  <div class="bet-sheet">
    <div class="bs-title">ВВЕДИТЕ СТАВКУ</div>
    <input class="bs-input" id="bet-input" type="number" min="1" inputmode="numeric" placeholder="50">
    <div class="bs-presets">
      <button class="bs-preset" onclick="bsPick(10)">10</button>
      <button class="bs-preset" onclick="bsPick(25)">25</button>
      <button class="bs-preset" onclick="bsPick(50)">50</button>
      <button class="bs-preset" onclick="bsPick(100)">100</button>
      <button class="bs-preset" onclick="bsPick(250)">250</button>
      <button class="bs-preset" onclick="bsPick(500)">500</button>
    </div>
    <button class="bs-confirm" onclick="confirmBet()">Подтвердить</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ──
const tg       = window.Telegram?.WebApp;
const initData = tg?.initData || '';

let balance      = 0;
let bet          = 50;
let mode         = 'CALM';
let spinning     = false;
let turbo        = false;
let autoSpins    = 0;
let autoRunning  = false;
let fsFreeLeft   = 0;
let stickyColumns= [];
let fsPendingWin = 0;
let lastWins     = [];
let bonusPending = false;

const BETS = [1,5,10,25,50,100,150,200,250,350,500,750,1000];
let betIdx = BETS.indexOf(50);

const EMOJI = {
  JELLYFISH:'🪼',SHELL:'🐚',CRAB:'🦀',FISH:'🐠',
  TURTLE:'🐢',OCTOPUS:'🐙',SHARK:'🦈',DOLPHIN:'🐬',
  WILD:'🌊',SCATTER:'🗼'
};
const SPIN_POOL = Object.values(EMOJI);

// ── Helpers ──
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function rndEmoji(){ return SPIN_POOL[Math.floor(Math.random()*SPIN_POOL.length)]; }
function fmt(n){
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}

// ── Grid ──
const gridEl = $('grid');
function initGrid(){
  gridEl.innerHTML='';
  for(let row=0;row<5;row++)
    for(let col=0;col<5;col++){
      const c=document.createElement('div');
      c.className='cell';c.id=`c${col}${row}`;
      c.textContent=rndEmoji();
      gridEl.appendChild(c);
    }
}
function G(col,row){ return $(`c${col}${row}`); }
function setSymbol(col,row,sym){
  const c=G(col,row);
  if(c) c.textContent=EMOJI[sym]||sym;
}

// ── Win lines SVG ──
const wlSvg = $('wl-svg');
function drawWinLines(lines){
  wlSvg.innerHTML='';
  const gr=gridEl.getBoundingClientRect();
  const colors=['#86efac','#38bdf8','#fbbf24','#f472b6','#a78bfa'];
  lines.forEach((line,li)=>{
    const pts=[];
    for(let col=0;col<(line.count||5);col++){
      const cell=G(col,line.rows[col]);
      if(!cell) continue;
      const cr=cell.getBoundingClientRect();
      pts.push({x:cr.left-gr.left+cr.width/2, y:cr.top-gr.top+cr.height/2});
    }
    if(pts.length<2) return;
    const color=colors[li%colors.length];
    const d=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    // glow
    const gl=document.createElementNS('http://www.w3.org/2000/svg','path');
    gl.setAttribute('d',d);gl.setAttribute('stroke',color);
    gl.setAttribute('stroke-width','8');gl.setAttribute('fill','none');
    gl.setAttribute('stroke-linecap','round');gl.setAttribute('stroke-linejoin','round');
    gl.setAttribute('opacity','0.18');wlSvg.appendChild(gl);
    // line
    const ln=document.createElementNS('http://www.w3.org/2000/svg','path');
    ln.setAttribute('d',d);ln.setAttribute('stroke',color);
    ln.setAttribute('stroke-width','2.5');ln.setAttribute('fill','none');
    ln.setAttribute('stroke-linecap','round');ln.setAttribute('stroke-linejoin','round');
    ln.style.opacity='0';
    ln.style.transition=`opacity .35s ease-out ${li*85}ms`;
    wlSvg.appendChild(ln);
    requestAnimationFrame(()=>{ ln.style.opacity='0.9'; });
    // dots
    pts.forEach(pt=>{
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx',pt.x);dot.setAttribute('cy',pt.y);dot.setAttribute('r','4');
      dot.setAttribute('fill',color);dot.style.opacity='0';
      dot.style.transition=`opacity .25s ease-out ${li*85+120}ms`;
      wlSvg.appendChild(dot);
      requestAnimationFrame(()=>{ dot.style.opacity='0.85'; });
    });
  });
}

// ── Mode ──
function setMode(m){
  if(spinning||fsFreeLeft>0) return;
  mode=m;
  document.body.className=m==='STORM'?'storm':'';
  $('m-calm').classList.toggle('active',m==='CALM');
  $('m-storm').classList.toggle('active',m==='STORM');
  tg?.HapticFeedback?.selectionChanged();
}

// ── Bet ──
function adjBet(dir){
  if(spinning) return;
  betIdx=Math.max(0,Math.min(BETS.length-1,betIdx+dir));
  bet=BETS[betIdx];
  $('bet-disp').textContent=bet;
  tg?.HapticFeedback?.selectionChanged();
}
function multBet(f){
  if(spinning) return;
  const target=Math.max(1,Math.round(bet*f));
  betIdx=BETS.reduce((bi,v,i)=>Math.abs(v-target)<Math.abs(BETS[bi]-target)?i:bi,0);
  bet=BETS[betIdx];
  $('bet-disp').textContent=bet;
  tg?.HapticFeedback?.selectionChanged();
}
function openBetModal(){
  if(spinning) return;
  $('bet-input').value=bet;
  $('bet-modal').classList.add('on');
  setTimeout(()=>$('bet-input').focus(),280);
}
function modalOutside(e){ if(e.target===$('bet-modal')) closeBetModal(); }
function closeBetModal(){ $('bet-modal').classList.remove('on'); }
function bsPick(v){ $('bet-input').value=v; }
function confirmBet(){
  const v=parseInt($('bet-input').value);
  if(!v||v<1){ showToast('Введи ставку от 1'); return; }
  bet=v;
  const idx=BETS.indexOf(v);
  if(idx>=0) betIdx=idx;
  $('bet-disp').textContent=bet;
  closeBetModal();
  tg?.HapticFeedback?.selectionChanged();
}

// ── Balance ──
function updateBalance(val){
  const prev=balance; balance=val;
  animCount($('bal'),prev,val);
  animCount($('bal2'),prev,val);
}
function animCount(el,from,to){
  if(from===to){ el.textContent=fmt(to); return; }
  const steps=16;const delta=(to-from)/steps;let i=0;
  const t=setInterval(()=>{
    i++;el.textContent=fmt(Math.round(from+delta*i));
    if(i>=steps){ clearInterval(t);el.textContent=fmt(to); }
  },20);
}

// ── FS UI ──
function updateFsUI(left,pending){
  fsFreeLeft=left;fsPendingWin=pending;
  if(left>0){ $('fs-cnt').textContent=left;$('fs-badge').classList.add('on'); }
  else $('fs-badge').classList.remove('on');
  $('m-calm').disabled=left>0;
  $('m-storm').disabled=left>0;
}

// ── Sticky ──
function applySticky(json){
  document.querySelectorAll('.cell.sticky').forEach(c=>c.classList.remove('sticky'));
  stickyColumns=parseSticky(json);
  stickyColumns.forEach(([col])=>{
    for(let row=0;row<5;row++) G(col,row)?.classList.add('sticky');
  });
}
function parseSticky(json){
  if(!json||json==='[]') return [];
  try{ return JSON.parse(json); }catch{ return []; }
}

// ── Spin animation ──
let spinIvs=[];
function startSpinAnim(){
  wlSvg.innerHTML='';
  clearWinRow();
  spinIvs.forEach(clearInterval);spinIvs=[];
  for(let col=0;col<5;col++){
    for(let row=0;row<5;row++){
      const c=G(col,row);if(!c) continue;
      c.classList.remove('win-hl','expanded','scatter-anim','bounce','flash-expand');
      c.querySelectorAll('.mult-badge').forEach(b=>b.remove());
      if(!stickyColumns.some(([sc])=>sc===col)) c.classList.add('spinning');
    }
    const iv=setInterval(()=>{
      for(let row=0;row<5;row++){
        const c=G(col,row);
        if(c?.classList.contains('spinning')) c.textContent=rndEmoji();
      }
    },68+col*11);
    spinIvs.push(iv);
  }
}
function stopCol(col,grid,delay){
  return new Promise(resolve=>setTimeout(()=>{
    clearInterval(spinIvs[col]);
    for(let row=0;row<5;row++){
      const c=G(col,row);if(!c) continue;
      c.classList.remove('spinning');
      c.textContent=EMOJI[grid[col][row]]||'?';
      c.classList.add('bounce');
      setTimeout(()=>c.classList.remove('bounce'),300);
    }
    tg?.HapticFeedback?.impactOccurred('light');
    resolve();
  },delay));
}
function stopAllReels(){
  spinIvs.forEach(clearInterval);spinIvs=[];
  for(let col=0;col<5;col++)
    for(let row=0;row<5;row++){
      const c=G(col,row);
      if(c){ c.classList.remove('spinning');c.textContent=rndEmoji(); }
    }
}

// ── Expand animation ──
async function animateExpand(wilds){
  for(const ew of wilds){
    const {col,mult}=ew;
    for(let row=0;row<5;row++) G(col,row)?.classList.add('flash-expand');
    tg?.HapticFeedback?.impactOccurred('medium');
    await sleep(turbo?70:180);
    for(let row=0;row<5;row++){
      const c=G(col,row);if(!c) continue;
      c.classList.remove('flash-expand','win-hl');
      c.textContent=EMOJI.WILD;
      c.classList.add('expanded');
      tg?.HapticFeedback?.impactOccurred('light');
      await sleep(turbo?35:78);
    }
    const mid=G(col,2);
    if(mid){
      const badge=document.createElement('div');
      badge.className='mult-badge';badge.textContent='×'+mult;
      mid.appendChild(badge);
      tg?.HapticFeedback?.impactOccurred('heavy');
      await sleep(turbo?120:380);
    }
  }
}

// ── Win display ──
function showWinOverlay(finalWin,totalMult){
  $('wo-amt').textContent='🐚 '+fmt(finalWin);
  $('wo-mult').textContent=totalMult>1?'×'+totalMult+' множитель':'';
  $('win-overlay').classList.add('on');
  setTimeout(()=>$('win-overlay').classList.remove('on'),2400);
}
function showWinRow(finalWin,totalMult,lineCount){
  $('wr-amt').textContent='🐚 '+fmt(finalWin);
  $('wr-mult').textContent=totalMult>1?'×'+totalMult:'';
  $('win-row').classList.add('on');
}
function clearWinRow(){ $('win-row').classList.remove('on'); }

// ── Big win ──
function showBigWin(finalWin,totalMult){
  $('bw-amt').textContent='🐚 '+fmt(finalWin);
  $('bw-mult').textContent=totalMult>1?'×'+totalMult:'';
  $('bigwin-overlay').classList.add('on');
  document.body.classList.add('flashing');
  tg?.HapticFeedback?.notificationOccurred('success');
  setTimeout(()=>document.body.classList.remove('flashing'),800);
  setTimeout(()=>dismissBigWin(),3500);
}
function dismissBigWin(){ $('bigwin-overlay').classList.remove('on'); }

// ── Bonus ──
function showBonus(count){
  $('bo-cnt').textContent=count;
  $('bonus-overlay').classList.add('on');
  tg?.HapticFeedback?.notificationOccurred('success');
}
function dismissBonus(){
  $('bonus-overlay').classList.remove('on');
  bonusPending=false;spinning=false;
  $('spin-btn').disabled=false;
  $('spin-btn').classList.remove('is-spinning');
  $('spin-btn').textContent='▶';
}

// ── Turbo ──
function toggleTurbo(){
  turbo=!turbo;
  $('turbo-btn').classList.toggle('active',turbo);
  tg?.HapticFeedback?.selectionChanged();
}

// ── Auto spin ──
function toggleAuto(){
  if(autoRunning){ autoSpins=0;autoRunning=false;$('auto-btn').classList.remove('active');$('auto-btn').textContent='↻ Авто';return; }
  autoSpins=10;autoRunning=true;
  $('auto-btn').classList.add('active');
  runAuto();
}
async function runAuto(){
  while(autoSpins>0&&autoRunning&&!bonusPending){
    $('auto-btn').textContent=`↻ ${autoSpins}`;
    await spin();
    autoSpins--;
    if(autoSpins<=0||!autoRunning||bonusPending) break;
    await sleep(turbo?80:200);
  }
  autoRunning=false;autoSpins=0;
  $('auto-btn').classList.remove('active');$('auto-btn').textContent='↻ Авто';
}

// ── Info ──
function showInfo(){ showToast('5×5 · Expanding Wild · Sticky FS · 10 бесплатных спинов'); }

// ── Wins strip ──
function addToStrip(w){
  lastWins.unshift(w);if(lastWins.length>15) lastWins.pop();
  const strip=$('wins-strip');strip.innerHTML='';
  lastWins.forEach(v=>{
    const d=document.createElement('div');
    d.className='wd'+(v>=bet*80?' mega':v>=bet*8?' big':'');
    d.textContent=v>0?'+'+fmt(v):'−';
    strip.appendChild(d);
  });
}

// ── Toast ──
let toastT;
function showToast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3000);
}

// ── API ──
async function apiSpin(){
  const r=await fetch('/api/mini/slot-war/spin',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},
    body:JSON.stringify({bet,mode})
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function apiState(){
  const r=await fetch('/api/mini/slot-war/state',{headers:{'X-Telegram-Init-Data':initData}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

// ── Spin flow ──
async function spin(){
  if(spinning||bonusPending) return;
  if(!initData){ showToast('Открой через Telegram'); return; }
  spinning=true;
  const btn=$('spin-btn');
  btn.disabled=true;btn.classList.add('is-spinning');btn.textContent='■';

  document.querySelectorAll('.mult-badge').forEach(b=>b.remove());
  document.querySelectorAll('.cell').forEach(c=>{
    c.classList.remove('win-hl','scatter-anim');
    const col=parseInt(c.id[1]);
    if(!stickyColumns.some(([sc])=>sc===col)) c.classList.remove('expanded');
  });

  startSpinAnim();

  let data;
  try{ data=await apiSpin(); }
  catch(e){
    showToast('Ошибка сети. Попробуй снова.');
    stopAllReels();spinning=false;
    btn.disabled=false;btn.classList.remove('is-spinning');btn.textContent='▶';
    return;
  }

  btn.classList.remove('is-spinning');btn.textContent='▶';

  if(data.error){
    stopAllReels();spinning=false;btn.disabled=false;
    const msgs={INSUFFICIENT_BALANCE:'Недостаточно ракушек 🐚',INVALID_BET:'Мин. ставка 1',ONBOARDING_REQUIRED:'Сначала зарегистрируйся в боте'};
    showToast(msgs[data.error]||data.error);
    return;
  }

  const grid=data.grid;
  const stagger=turbo?55:195;
  const stops=[];
  for(let col=0;col<5;col++) stops.push(stopCol(col,grid,stagger+col*stagger));
  await Promise.all(stops);

  // Scatters
  if(data.scatterCount>0){
    for(let col=0;col<5;col++)
      for(let row=0;row<5;row++)
        if(grid[col][row]==='SCATTER') G(col,row)?.classList.add('scatter-anim');
    await sleep(turbo?120:320);
  }

  // Expand wilds
  if(data.expandedWilds?.length>0) await animateExpand(data.expandedWilds);

  // Win lines
  if(data.winLines?.length>0){
    data.winLines.forEach(l=>{
      for(let col=0;col<(l.count||5);col++) G(col,l.rows[col])?.classList.add('win-hl');
    });
    await sleep(turbo?40:90);
    drawWinLines(data.winLines);
    await sleep(turbo?120:380);
  }

  // Update state
  updateBalance(data.newBalance);
  updateFsUI(data.freeSpinsRemaining,data.fsPendingWin);
  applySticky(data.stickyColumnsJson);

  // Win result
  if(data.finalWin>0){
    const isBig=data.finalWin>=bet*40;
    showWinRow(data.finalWin,data.totalMult,data.winLines?.length||0);
    if(!isBig) showWinOverlay(data.finalWin,data.totalMult);
    addToStrip(data.finalWin);
    if(isBig){ await sleep(180);showBigWin(data.finalWin,data.totalMult); }
  } else {
    addToStrip(0);
  }

  // Bonus
  if(data.bonusTriggered){
    bonusPending=true;
    await sleep(550);
    showBonus(data.freeSpinsRemaining||10);
    return;
  }

  // FS end
  if(data.wasFreeSpins&&!data.freeSpinsRemaining&&fsPendingWin>0)
    setTimeout(()=>showToast(`🎰 Фри-спины: итого 🐚 ${fmt(data.fsPendingWin)}`),500);

  await sleep(turbo?80:280);
  spinning=false;btn.disabled=false;
}

// ── Init ──
async function init(){
  tg?.expand();
  tg?.setHeaderColor?.('#0d1b2e');
  tg?.setBackgroundColor?.('#0d1b2e');
  tg?.ready?.();
  initGrid();
  if(!initData){ showToast('Открой через Telegram'); return; }
  try{
    const st=await apiState();
    if(st.onboardingRequired){ showToast(st.message||'Сначала зарегистрируйся'); return; }
    balance=0;updateBalance(st.balance);
    if(st.mode) setMode(st.mode);
    if(st.lastBet){ const i=BETS.indexOf(st.lastBet);if(i>=0){betIdx=i;bet=st.lastBet;$('bet-disp').textContent=bet;} }
    updateFsUI(st.freeSpinsRemaining||0,st.fsPendingWin||0);
    applySticky(st.stickyColumnsJson);
  }catch(e){
    console.error('Init:',e);
    showToast('Ошибка загрузки. Перезапусти.');
  }
}

init();
</script>
