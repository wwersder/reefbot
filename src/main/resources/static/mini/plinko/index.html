<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Reef Plinko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Loading -->
<div id="screen-loading">
    <div class="spinner"></div>
</div>

<!-- Onboarding / error -->
<div id="screen-onboarding">
    <div class="ob-emoji">🏝️</div>
    <h2 id="ob-title">Сначала зарегистрируйся!</h2>
    <p id="ob-text">Сначала заверши регистрацию в боте — напиши /start</p>
</div>

<!-- Main app -->
<div id="app">

    <!-- Header -->
    <div id="topbar">
        <span id="game-title">🪷 Reef Plinko</span>
        <span id="balance-display">🐚 <span id="balance-num">0</span></span>
    </div>

    <!-- Plinko board -->
    <div id="canvas-wrap">
        <canvas id="plinko-canvas"></canvas>
    </div>

    <!-- Result line -->
    <div id="result-bar">
        <span id="result-text" class="neutral">Выбери ставку и бросай</span>
    </div>

    <!-- Controls -->
    <div id="controls">

        <!-- Bet -->
        <div class="section">
            <div class="section-label">Ставка <span class="hint">(баланс: <span id="balance-hint">0</span> 🐚)</span></div>
            <div id="bet-row">
                <button class="adj-btn" id="bet-minus">−</button>
                <input type="number" id="bet-input" value="25" min="5" max="500" inputmode="numeric">
                <span class="bet-unit">🐚</span>
                <button class="adj-btn" id="bet-plus">+</button>
            </div>
            <div id="mult-btns">
                <button class="mult-btn" data-mult="0.5">½</button>
                <button class="mult-btn" data-mult="2">×2</button>
                <button class="mult-btn" data-mult="5">×5</button>
                <button class="mult-btn" data-mult="10">×10</button>
                <button class="mult-btn" data-mult="max">MAX</button>
            </div>
        </div>

        <div class="divider"></div>

        <!-- Risk + rows -->
        <div class="section selects-row">
            <select id="risk-select">
                <option value="LOW">🟢 Низкий риск</option>
                <option value="MEDIUM" selected>🟡 Средний</option>
                <option value="HIGH">🔴 Высокий</option>
            </select>
            <select id="rows-select">
                <option value="8" selected>8 рядов</option>
                <option value="12">12 рядов 🔓</option>
            </select>
        </div>

        <!-- Throw button -->
        <div class="section">
            <button id="throw-btn">БРОСИТЬ</button>
        </div>

        <!-- Checkboxes -->
        <div class="section checks-row">
            <label class="check-lbl">
                <input type="checkbox" id="auto-check">
                <span>Авто-спин (100x)</span>
            </label>
            <label class="check-lbl">
                <input type="checkbox" id="turbo-check">
                <span>Турбо ⚡</span>
            </label>
        </div>

        <!-- Leaderboard link -->
        <div class="section lb-footer">
            <button id="lb-btn" class="link-btn">🏆 Рекорды</button>
        </div>

    </div><!-- /controls -->

</div><!-- /app -->

<!-- Leaderboard bottom sheet -->
<div id="lb-overlay">
    <div id="lb-backdrop"></div>
    <div id="lb-sheet">
        <div id="lb-handle"></div>
        <div id="lb-header">
            <span>🏆 Рекорды</span>
            <button id="lb-close">✕</button>
        </div>
        <div id="lb-content">
            <div class="lb-placeholder">⏳ Загрузка...</div>
        </div>
    </div>
</div>

<script type="module">
    import { init } from './ui.js';
    init();
</script>
</body>
</html>
