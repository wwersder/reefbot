<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Reef Plinko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Loading -->
<div id="screen-loading">
    <div class="spinner"></div>
</div>

<!-- Onboarding / error -->
<div id="screen-onboarding">
    <div class="emoji">🏝️</div>
    <h2>Сначала зарегистрируйся!</h2>
    <p>Сначала заверши регистрацию в боте — напиши /start</p>
</div>

<!-- Main app -->
<div id="app" style="display:none">

    <!-- Top bar -->
    <div id="topbar">
        <span class="title">🪷 Reef Plinko</span>
        <span id="balance-display">🐚 <span class="num" id="balance-num">0</span></span>
    </div>

    <!-- Tab bar -->
    <div id="tabbar">
        <button class="tab-btn active" data-tab="game">🎰 Игра</button>
        <button class="tab-btn"       data-tab="top">🏆 Рекорды</button>
    </div>

    <!-- Game panel -->
    <div id="panel-game" class="tab-panel active">

        <!-- Risk + rows + bet controls -->
        <div id="controls">
            <select id="risk-select">
                <option value="LOW">Низкий</option>
                <option value="MEDIUM" selected>Средний</option>
                <option value="HIGH">Высокий</option>
            </select>

            <select id="rows-select">
                <option value="8" selected>8 рядов</option>
                <option value="12">12 рядов 🔓</option>
            </select>

            <div id="bet-wrap">
                <button class="bet-adj" id="bet-minus">−</button>
                <div id="bet-display">25 🐚</div>
                <button class="bet-adj" id="bet-plus">+</button>
            </div>
        </div>

        <!-- Quick bet -->
        <div id="quick-bets">
            <button class="qbet-btn" data-bet="5">5</button>
            <button class="qbet-btn" data-bet="10">10</button>
            <button class="qbet-btn active" data-bet="25">25</button>
            <button class="qbet-btn" data-bet="50">50</button>
            <button class="qbet-btn" data-bet="100">100</button>
            <button class="qbet-btn" data-bet="250">250</button>
            <button class="qbet-btn" data-bet="500">500</button>
        </div>

        <!-- Daily limit bar -->
        <div id="limit-bar-wrap">
            <span id="limit-label">Потери: 0/2000 🐚</span>
            <div id="limit-bar"><div id="limit-bar-fill" style="width:0%"></div></div>
        </div>

        <!-- Canvas -->
        <div id="canvas-wrap">
            <canvas id="plinko-canvas"></canvas>
            <div id="result-flash"></div>
        </div>

        <!-- Throw + auto -->
        <div id="bottom-bar">
            <button id="throw-btn">🪷 Бросить</button>
            <div id="auto-wrap">
                <button id="auto-btn" title="Авто-бросок (макс. 100)">▶▶</button>
                <span id="auto-count"></span>
            </div>
        </div>

    </div><!-- /panel-game -->

    <!-- Leaderboard panel -->
    <div id="panel-top" class="tab-panel">
        <div class="lb-loading">⏳ Загрузка...</div>
    </div>

</div><!-- /app -->

<script type="module">
    import { init } from './ui.js';
    init();
</script>
</body>
</html>
