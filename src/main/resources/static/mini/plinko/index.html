<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Reef Plinko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=21">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Loading -->
<div id="screen-loading"><div class="spinner"></div></div>

<!-- Onboarding / error -->
<div id="screen-onboarding">
    <div class="ob-emoji">🏝️</div>
    <h2 id="ob-title">Сначала зарегистрируйся!</h2>
    <p id="ob-text">Сначала заверши регистрацию в боте — напиши /start</p>
</div>

<!-- App -->
<div id="app">

    <!-- Unified dark game zone: topbar + canvas -->
    <div id="game-zone">
        <div id="topbar">
            <span id="game-title">🪷 Reef Plinko</span>
            <span id="balance-display">🐚 <span id="balance-num">0</span></span>
        </div>

        <!-- Last 10 results strip -->
        <div id="results-strip"></div>

        <div id="canvas-wrap">
            <canvas id="plinko-canvas"></canvas>
            <!-- Result floats as a glass pill over the canvas -->
            <div id="result-bar">
                <span id="result-text" class="neutral">Выбери ставку и бросай</span>
            </div>
        </div>
    </div>

    <div id="controls">

        <!-- Bet card -->
        <div class="ctrl-card">
            <div class="card-label">Ставка <span class="card-hint">баланс: <span id="balance-hint">0</span> 🐚</span></div>
            <div id="bet-row">
                <button class="adj-btn" id="bet-minus">−</button>
                <input type="number" id="bet-input" value="25" min="5"
                       inputmode="numeric" enterkeyhint="done" autocomplete="off">
                <span class="bet-unit">🐚</span>
                <button class="adj-btn" id="bet-plus">+</button>
            </div>
            <div id="mult-btns">
                <button class="mult-btn" data-mult="0.5">½</button>
                <button class="mult-btn" data-mult="2">×2</button>
                <button class="mult-btn" data-mult="5">×5</button>
                <button class="mult-btn" data-mult="10">×10</button>
                <button class="mult-btn" data-mult="max">MAX</button>
            </div>
        </div>

        <!-- Throw button -->
        <button id="throw-btn">БРОСИТЬ</button>
        <div id="auto-progress"><div id="auto-bar"></div></div>

        <!-- Settings card: risk + rows -->
        <div class="ctrl-card">
            <div class="card-label">Риск</div>
            <div class="seg-ctrl" id="risk-seg">
                <button class="seg-btn" data-val="LOW">🟢 Низкий</button>
                <button class="seg-btn active" data-val="MEDIUM">🟡 Средний</button>
                <button class="seg-btn" data-val="HIGH">🔴 Высокий</button>
            </div>
            <div class="card-label" style="margin-top:12px">Доска</div>
            <div class="seg-ctrl" id="rows-seg">
                <button class="seg-btn active" data-val="8">8 рядов</button>
                <button class="seg-btn" data-val="12" id="rows-btn-12">12 рядов 🔓</button>
            </div>
        </div>

        <!-- Toggles card -->
        <div class="ctrl-card toggles-card">
            <div class="toggle-row">
                <span class="toggle-label">Авто-спин (100x)</span>
                <label class="toggle">
                    <input type="checkbox" id="auto-check">
                    <span class="toggle-track"></span>
                </label>
            </div>
            <div class="toggle-divider"></div>
            <div class="toggle-row">
                <span class="toggle-label">Турбо режим ⚡</span>
                <label class="toggle">
                    <input type="checkbox" id="turbo-check">
                    <span class="toggle-track"></span>
                </label>
            </div>
        </div>

        <!-- Leaderboard link -->
        <div class="lb-footer">
            <button id="lb-btn" class="link-btn"></button>
        </div>

    </div>

</div>

<!-- Jackpot fullscreen flash -->
<div id="jackpot-flash"></div>

<!-- Leaderboard bottom sheet -->
<div id="lb-overlay">
    <div id="lb-backdrop"></div>
    <div id="lb-sheet">
        <div id="lb-handle"></div>
        <div id="lb-header">
            <span>🏆 Рекорды</span>
            <button id="lb-close">✕</button>
        </div>
        <div id="lb-content">
            <div class="lb-placeholder">⏳ Загрузка...</div>
        </div>
    </div>
</div>

<script type="module">
    import { init } from './ui.js?v=21';
    init();
</script>
</body>
</html>
